# 4h봉 마감 직후(UTC 00/04/08/12/16/20시 + 7분) 시그널 스캔.
# 주의: schedule 트리거는 레포 '기본 브랜치'의 워크플로만 동작한다.
name: Signal Scan

on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write            # 알림 상태 파일 커밋용

concurrency:
  group: signal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 시크릿이 비어 있습니다. 레포 Settings → Secrets에 등록하세요." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 미국 러너에서 fapi가 막히면 자동으로 현물 미러 폴백.
          # 진짜 퍼프 데이터가 필요하면 비미국 프록시 주소를 시크릿으로 지정.
          BINANCE_FAPI_BASE: ${{ secrets.BINANCE_FAPI_BASE }}
          # Quant-Portfolio(퍼블릭) 리포트에서 주식 감시 목록 자동 로드.
          # 기본 GITHUB_TOKEN으로 충분 — 프라이빗으로 되돌리면 PAT를 등록.
          QP_GITHUB_TOKEN: ${{ secrets.QP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: python -m invest_signal --state state/alerts_state.json

      - name: Commit alert state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "상태 변화 없음"
            exit 0
          fi
          # 봇 소유 파일이므로 우리 버전이 항상 이긴다 — 충돌 시 리셋 후 재커밋
          cp state/alerts_state.json /tmp/alerts_state.json
          git commit -m "chore: update alert state [skip ci]"
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git push origin "HEAD:${BRANCH}" && exit 0
            git rebase --abort 2>/dev/null || true
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            cp /tmp/alerts_state.json state/alerts_state.json
            git add state/
            git commit -m "chore: update alert state [skip ci]" || true
            sleep 3
          done
          echo "::error::상태 파일 푸시 실패 — 다음 실행에서 중복 알림 가능" >&2
          exit 1

# 매시 1회 스캔 — 실행 시각의 UTC 시(hour)를 보고 모드를 스스로 고른다.
# (수동 실행 트리거: 2026-08-16 — 파동 시그널 첫 실행 확인)
#
#   UTC 00/04/08/12/16/20시 (= KST 09/13/17/21/01/05) → 마감 스캔
#     4h봉이 막 닫힌 시각. 전 시그널을 마감된 봉으로 판정한다.
#   나머지 18개 시간                                  → 인트라바 스캔
#     진행 중인 봉을 포함해 판정 — 신규 알림은 상승초입·눌림목·펌핑초기만이고
#     알림에 ⏳진행봉 태그가 붙는다. 하락전환·MSS는 마감 스캔 전용.
#     **추적(↳) 목록은 두 모드 모두 싣는다** — 조건이 깨진 항목을 마감까지
#     최대 4시간 남겨 두지 않으려고, 매시간 최신 상태로 갱신한다.
#   (크립토 모멘텀 눌림목/이탈은 15m봉이라 두 모드 모두에서 매번 돈다)
#
#   인트라바는 크립토 전용이다 — ETF·주식은 마감 스캔에서만 돈다.
#
# 실행은 외부 크론(cron-job.org)이 매시 정각에 workflow_dispatch를 호출해
# 트리거한다 — 워크플로가 하나라서 URL 하나·스케줄 하나면 된다.
#
# **schedule 트리거는 쓰지 않는다.** 보험으로 켜 뒀더니 외부 크론과 겹쳐
# 매시 알림이 두 번 나갔다: 외부 크론은 :02에 정확히 도는데, schedule은
# 크론 시각보다 수십 분 밀려(관측 +17~175분, 중앙값 ~50분) :16~:58 사이
# 아무 데나 떨어졌다. 두 실행이 서로 다른 봉 상태를 보니 dedup으로도 안
# 걸러지고 각자 알림을 냈다. 외부 크론이 죽으면 알림이 끊기는 건 맞지만,
# 그건 조용한 실패라 매시 중복 발송보다 낫다(README '크론 지연' 참고).
#
# 수동 실행: Actions 탭의 "Run workflow", 또는 외부 크론이 쓰는 것과 같은
# workflow_dispatch API 호출. 둘 다 못 쓰는 환경(Actions 쓰기 권한이 없는
# 통합 등)에서는 **이 파일을 수정해 푸시하면 아래 push 트리거로 즉시 1회
# 실행된다** — 그래서 paths를 이 파일 하나로 좁혀 뒀다.
name: Signal Scan

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "판정 모드 — auto면 UTC 시로 자동 선택"
        type: choice
        options: [auto, close, intrabar]
        default: auto
  push:
    branches: [claude/signal-alarm-feature-yo698c]
    paths: [".github/workflows/scan.yml"]

permissions:
  contents: write            # 알림 상태 파일 커밋용

concurrency:
  group: signal-scan         # 겹쳐 떠도 직렬화 — 상태 커밋 경쟁 방지
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 시크릿이 비어 있습니다. 레포 Settings → Secrets에 등록하세요." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scan
        env:
          # 입력값은 셸에 직접 보간하지 않고 환경변수로 받는다(스크립트 주입 방지).
          # type: choice라 auto|close|intrabar 셋 중 하나이고, schedule/push에선 빈 값.
          MODE_IN: ${{ inputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 미국 러너에서 fapi가 막히면 자동으로 현물 미러 폴백.
          # 진짜 퍼프 데이터가 필요하면 둘 중 하나를 시크릿으로 지정:
          #  - BINANCE_PROXY: 비미국 HTTP/SOCKS 프록시 (http://user:pass@ip:port)
          #  - BINANCE_FAPI_BASE: fapi로 포워딩하는 비미국 리버스프록시 주소
          BINANCE_PROXY: ${{ secrets.BINANCE_PROXY }}
          BINANCE_FAPI_BASE: ${{ secrets.BINANCE_FAPI_BASE }}
          # Quant-Portfolio(퍼블릭) 리포트에서 주식 감시 목록 자동 로드.
          # 기본 GITHUB_TOKEN으로 충분 — 프라이빗으로 되돌리면 PAT를 등록.
          QP_GITHUB_TOKEN: ${{ secrets.QP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          MODE="${MODE_IN:-auto}"
          HOUR=$((10#$(date -u +%H)))          # 10# — "08"을 8진수로 읽지 않게
          if [ "$MODE" = "auto" ]; then
            if [ $((HOUR % 4)) -eq 0 ]; then MODE=close; else MODE=intrabar; fi
          fi
          echo "UTC $(date -u '+%Y-%m-%d %H:%M') · 모드 $MODE"
          if [ "$MODE" = "close" ]; then
            python -m invest_signal --state state/alerts_state.json
          else
            python -m invest_signal --state state/alerts_state.json --intrabar
          fi

      - name: Commit alert state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "상태 변화 없음"
            exit 0
          fi
          # 봇 소유 파일이므로 우리 버전이 항상 이긴다 — 충돌 시 리셋 후 재커밋
          cp state/alerts_state.json /tmp/alerts_state.json
          git commit -m "chore: update alert state [skip ci]"
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git push origin "HEAD:${BRANCH}" && exit 0
            git rebase --abort 2>/dev/null || true
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            cp /tmp/alerts_state.json state/alerts_state.json
            git add state/
            git commit -m "chore: update alert state [skip ci]" || true
            sleep 3
          done
          echo "::error::상태 파일 푸시 실패 — 다음 실행에서 중복 알림 가능" >&2
          exit 1

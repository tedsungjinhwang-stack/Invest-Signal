# 매시 1회 스캔 — 실행 시각의 UTC 시(hour)를 보고 모드를 스스로 고른다.
#
#   UTC 00/04/08/12/16/20시 (= KST 09/13/17/21/01/05) → 마감 스캔
#     4h봉이 막 닫힌 시각. 전 시그널을 마감된 봉으로 판정한다.
#   나머지 18개 시간                                  → 인트라바 스캔
#     진행 중인 봉을 포함해 판정 — 상승초입·눌림목만,
#     알림에 ⏳진행봉 태그가 붙는다. 하락전환·MSS는 마감 스캔 전용.
#   (주도주 이탈은 15m봉이라 두 모드 모두에서 매번 돈다)
#
# 워크플로가 하나라서 외부 크론은 URL 하나·스케줄 하나(`0 * * * *`)면 된다.
# schedule 트리거는 그 외부 크론이 죽었을 때를 위한 보험으로 남겨 둔다 —
# 다만 schedule은 크론 시각보다 수십 분 밀리므로(관측 +17~175분, 중앙값 ~50분)
# 지연이 시 경계를 넘으면 모드가 한 칸 밀릴 수 있다. 정시성이 필요하면
# workflow_dispatch를 외부에서 호출하는 쪽이 정답이다(README '크론 지연' 참고).
#
# 이 파일을 수정해 푸시하면 즉시 1회 실행된다(수동 실행 대용).
name: Signal Scan

on:
  schedule:
    - cron: "7 * * * *"       # 매시 :07 — 정각은 GitHub 예약 대기열 피크라 피한다
  workflow_dispatch:
    inputs:
      mode:
        description: "판정 모드 — auto면 UTC 시로 자동 선택"
        type: choice
        options: [auto, close, intrabar]
        default: auto
  push:
    branches: [claude/signal-alarm-feature-yo698c]
    paths: [".github/workflows/scan.yml"]

permissions:
  contents: write            # 알림 상태 파일 커밋용

concurrency:
  group: signal-scan         # 겹쳐 떠도 직렬화 — 상태 커밋 경쟁 방지
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 시크릿이 비어 있습니다. 레포 Settings → Secrets에 등록하세요." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scan
        env:
          # 입력값은 셸에 직접 보간하지 않고 환경변수로 받는다(스크립트 주입 방지).
          # type: choice라 auto|close|intrabar 셋 중 하나이고, schedule/push에선 빈 값.
          MODE_IN: ${{ inputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 미국 러너에서 fapi가 막히면 자동으로 현물 미러 폴백.
          # 진짜 퍼프 데이터가 필요하면 둘 중 하나를 시크릿으로 지정:
          #  - BINANCE_PROXY: 비미국 HTTP/SOCKS 프록시 (http://user:pass@ip:port)
          #  - BINANCE_FAPI_BASE: fapi로 포워딩하는 비미국 리버스프록시 주소
          BINANCE_PROXY: ${{ secrets.BINANCE_PROXY }}
          BINANCE_FAPI_BASE: ${{ secrets.BINANCE_FAPI_BASE }}
          # Quant-Portfolio(퍼블릭) 리포트에서 주식 감시 목록 자동 로드.
          # 기본 GITHUB_TOKEN으로 충분 — 프라이빗으로 되돌리면 PAT를 등록.
          QP_GITHUB_TOKEN: ${{ secrets.QP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          MODE="${MODE_IN:-auto}"
          HOUR=$((10#$(date -u +%H)))          # 10# — "08"을 8진수로 읽지 않게
          if [ "$MODE" = "auto" ]; then
            if [ $((HOUR % 4)) -eq 0 ]; then MODE=close; else MODE=intrabar; fi
          fi
          echo "UTC $(date -u '+%Y-%m-%d %H:%M') · 모드 $MODE"
          if [ "$MODE" = "close" ]; then
            python -m invest_signal --state state/alerts_state.json
          else
            python -m invest_signal --state state/alerts_state.json --intrabar
          fi

      - name: Commit alert state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "상태 변화 없음"
            exit 0
          fi
          # 봇 소유 파일이므로 우리 버전이 항상 이긴다 — 충돌 시 리셋 후 재커밋
          cp state/alerts_state.json /tmp/alerts_state.json
          git commit -m "chore: update alert state [skip ci]"
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git push origin "HEAD:${BRANCH}" && exit 0
            git rebase --abort 2>/dev/null || true
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            cp /tmp/alerts_state.json state/alerts_state.json
            git add state/
            git commit -m "chore: update alert state [skip ci]" || true
            sleep 3
          done
          echo "::error::상태 파일 푸시 실패 — 다음 실행에서 중복 알림 가능" >&2
          exit 1

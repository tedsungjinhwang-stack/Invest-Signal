# 테스트 + GitHub Actions 러너에서 데이터 소스 접근/스캐너 dry-run 검증.
name: Test & Dry-Run

on:
  workflow_dispatch: {}
  push:
    branches: [main, claude/signal-alarm-feature-yo698c]
    paths:
      - ".github/workflows/binance-connectivity-test.yml"
      - "invest_signal/**"
      - "tests/**"
      - "config.yaml"
      - "requirements*.txt"

concurrency:
  group: connectivity-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Probe Binance endpoints
        run: |
          probe () {
            local name="$1" url="$2"
            code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 15 "$url" || echo "ERR")
            echo "== $name -> HTTP $code"
          }
          probe "futures (fapi.binance.com)"         "https://fapi.binance.com/fapi/v1/ping"
          probe "spot (api.binance.com)"             "https://api.binance.com/api/v3/ping"
          probe "spot data mirror (binance.vision)"  "https://data-api.binance.vision/api/v3/ping"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: ETF scan dry-run
        env:
          QP_GITHUB_TOKEN: ${{ secrets.QP_GITHUB_TOKEN }}
        run: python -m invest_signal --only etf --dry-run

      - name: Crypto scan dry-run
        run: python -m invest_signal --only crypto --dry-run

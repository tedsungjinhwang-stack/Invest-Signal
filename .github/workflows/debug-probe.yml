# (실행 트리거: 2026-08-29 — ZKC 8/20 파동 미발송 원인, 퍼프 거래대금 확인)
# 심볼 진단 프로브 — 아래 PROBE_SYMBOLS를 바꿔 푸시하면 러너(프록시 경유
# 선물 데이터)에서 해당 코인의 봉/VWAP/거래대금/시그널 판정을 출력한다.
# PROBE_DAYS(UTC 날짜, 쉼표 구분)를 주면 그 날의 일봉 요약만 따로 찍는다.
# PROBE_MODE=turnover면 거래대금 하한 스윕, perf면 알림 사후 성과 분석,
# leaders면 PROBE_SIGNAL 시그널의 대박/쪽박 선별 분석(피처별 성과 + 룰 시뮬).
# PROBE_REPLAY=1이면 알림 기록 대신 과거 캔들에 디텍터를 다시 돌려 표본을 늘린다.
# 퍼프 전용 종목·퍼프 거래대금은 샌드박스의 현물 미러에 없어 여기서만 확인된다.
# 알림 미발송, 상태 파일 미변경 — 순수 조회용.
name: Debug Probe

on:
  push:
    branches: [claude/signal-alarm-feature-yo698c, main]
    paths:
      - ".github/workflows/debug-probe.yml"
      - "scripts/debug_probe.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe
        env:
          BINANCE_PROXY: ${{ secrets.BINANCE_PROXY }}
          BINANCE_FAPI_BASE: ${{ secrets.BINANCE_FAPI_BASE }}
          # PROBE_MODE=turnover면 심볼 진단 대신 거래대금 하한 스윕을 돈다 —
          # 하한별 통과 종목 수와, 최근 발송된 알림의 종목이 살아남는지.
          PROBE_MODE: ""
          PROBE_SIGNAL: "wave_setup"
          PROBE_REPLAY: "1"        # 알림 기록 대신 과거 캔들에서 재현 (④ 🍃 룰 분해 포함)
          PROBE_DAYS_BACK: "30"
          PROBE_BIG: "20"          # 대박 기준 — 7일 내 MFE ≥ +20%
          PROBE_BAD: "15"          # 쪽박 기준 — 7일 내 MAE ≤ -15%
          PROBE_FLOORS: "1,2,3,5,10"
          PROBE_RECENT_MSGS: "6"
          PROBE_SYMBOLS: "ZKCUSDT"
          PROBE_DAYS: "2026-08-18,2026-08-19,2026-08-20,2026-08-21"
          PROBE_WAVE_TF: "30m"        # 파동 판정 봉
          PROBE_WAVE_ST: "30x6"      # 장기 수퍼트렌드 (흰 선)
          PROBE_WAVE_ST_FAST: "22x3" # 단기 (초록/빨강)
          PROBE_WAVE_BARS: "1600"
          PROBE_FIBS: "0.618,0.786,0.886"
          PROBE_WAVE_FROM: "2026-07-31"
          PROBE_WAVE_TO: "2026-08-10"
        run: python scripts/debug_probe.py

# 인트라바 스캔 — 4h봉 '중간'(마감 2시간 뒤)에 진행 중인 봉을 포함해
# 판정한다. 대상: 펌핑 터치(진행 중에도 확정 사실) + 상승초입·눌림목
# (현재가를 잠정 종가로 — 알림에 ⏳진행봉 태그, 마감 때 되돌릴 수 있음).
# 하락전환·MSS는 마감 스캔 전용. 마감 스캔(scan.yml, 마감+1분)과 번갈아
# 사실상 2시간 간격이 된다.
# UTC 02:01/06:01/10:01/14:01/22:01 = KST 11:01/15:01/19:01/23:01/07:01
# (KST 03시 슬롯은 심야라 제외).
name: Intrabar Pump Scan

on:
  schedule:
    - cron: "1 2,6,10,14,22 * * *"
  workflow_dispatch: {}
  push:
    branches: [claude/signal-alarm-feature-yo698c]
    paths: [".github/workflows/scan-intrabar.yml"]

permissions:
  contents: write            # 알림 상태 파일 커밋용

concurrency:
  group: signal-scan         # 마감 스캔과 직렬화 — 상태 커밋 경쟁 방지
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 시크릿이 비어 있습니다." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intrabar scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_PROXY: ${{ secrets.BINANCE_PROXY }}
          BINANCE_FAPI_BASE: ${{ secrets.BINANCE_FAPI_BASE }}
        run: python -m invest_signal --state state/alerts_state.json --intrabar

      - name: Commit alert state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "상태 변화 없음"
            exit 0
          fi
          cp state/alerts_state.json /tmp/alerts_state.json
          git commit -m "chore: update alert state [skip ci]"
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git push origin "HEAD:${BRANCH}" && exit 0
            git rebase --abort 2>/dev/null || true
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            cp /tmp/alerts_state.json state/alerts_state.json
            git add state/
            git commit -m "chore: update alert state [skip ci]" || true
            sleep 3
          done
          echo "::error::상태 파일 푸시 실패 — 다음 실행에서 중복 알림 가능" >&2
          exit 1

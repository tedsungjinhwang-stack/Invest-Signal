# Invest-Signal 설정

signal:
  uptrend_onset:            # 상승초입 (4h봉): 역배열 + 240터치 → 60선 이탈
    enabled: true
    touch_window_bars: 60   # 240선 터치 후 60선 이탈을 기다리는 기간 — 60봉 = 10일
    grace_bars: 1           # 직전 스캔을 놓쳤을 때 소급 허용할 봉 수
    qvwap_condition: true   # 트리거 봉 종가가 분기 앵커드 VWAP 위여야 알림 (아래면 위로 올 때까지 대기)
    crypto_rank_filter:     # 크립토 전용 — 3파 전 초입이라 눌림목보다 낮은 기준
      enabled: true
      volume_top: 200       # 24h 거래대금 상위 N위 이내, 또는
      gain_top: 100         # 최근 3일 상승률 상위 N위 이내면 통과하되
      gain_lookback_bars: 18  # 상승률 계산 구간 — 18봉 = 3일
      min_turnover_usd: 1000000  # 24h 거래대금 $1M 미만은 무조건 제외
  pullback:                 # 눌림목 (4h봉): 480선 위 + 60선 하회 + 분기VWAP 하단밴드
    enabled: true
    ma_entry: 60            # ② 이 선을 하회해야 함 (단기 조정)
    ma_above: 480           # ① 종가가 이 선 위여야 함 (장기 추세 유지)
    band_mult: 1.0          # ③ 하단 밴드 = 분기VWAP − mult×표준편차 (2.0이면 더 깊은 눌림만)
    band_condition: true    # 밴드 조건 사용 — false면 ①②만 본다
    grace_bars: 1
    crypto_rank_filter:     # 크립토 전용 — 눌림목 칸 전체(눌림목+MSS+펌핑)에 주도주 필터 (ETF·주식엔 미적용)
      enabled: true
      volume_top: 100       # 24h 거래대금 상위 N위 이내, 또는
      gain_top: 50          # 최근 3일 상승률 상위 N위 이내면 통과하되
      gain_lookback_bars: 18  # 상승률 계산 구간 — 18봉 = 3일
      min_turnover_usd: 5000000  # 24h 거래대금 $5M 미만은 무조건 제외 (유동성 하한)
  downtrend_reversal:       # 하락전환 (4h봉): 60선 아래 눌림의 직전저점 하향돌파(CHoCH)
    # ETF·주식은 🔻하락전환 칸에 알림·추적 표시. 크립토는 표시하지 않고
    # 눌림목 항목을 '유지 중' 리스트에서 제거하는 용도로만 사용
    # (enabled: false면 표시·제거 둘 다 안 함)
    enabled: true
    ma_ref: 60              # 눌림 판정 기준선
    lookback_bars: 180      # 직전저점 유효기간 — 180봉 = 30일
    grace_bars: 1
    qvwap_condition: true   # 돌파 봉 종가가 분기 앵커드 VWAP 아래여야 알림 (상승초입의 거울)
  pump_dip:                 # 펌핑 (4h봉, 크립토 전용): 하루 내 급등 후 월간 VWAP 첫 터치
    enabled: true
    peak_lookback_bars: 42  # 터치 시점 기준 고점 유효기간 — 42봉 = 7일
    pump_window_bars: 6     # 급등 속도 판정 — 고점 직전 6봉 = 하루
    min_gain: 0.3           # 하루 내 저점→고점 상승률 하한 (0.3 = +30%)
    touch_tolerance: 0.003  # 저가가 라인 위 0.3% 이내 접근도 터치 인정
    grace_bars: 1
  pump_early:               # 펌핑초기 (4h봉, 크립토 전용): 막 불붙은 봉 — 아직 크게 안 간 종목만
    enabled: true
    rise_bars: 1            # 급등 판정 구간 — 1봉 = 4시간 (2로 올리면 8시간)
    min_gain: 0.05          # 구간 시가 대비 종가 상승률 하한 (0.05 = +5%)
    lookback_bars: 42       # '아직 초기' 판정 구간 — 42봉 = 7일
    pump_window_bars: 6     # 이미 펌핑했는지 볼 창 — 6봉 = 하루 (펌핑 시그널과 동일 정의)
    max_pump_gain: 0.30     # 위 구간 안에 '하루 내 저점→고가 +30% 이상' 봉이 있으면 제외
    max_gain: 0.30          # 누적 기준 — 42봉 저점 대비 종가가 이 이상이면 제외
    ma_ref: 480             # 이 선 이하에 캔들이 있어야 함 (480봉 미만 신규 상장은 자동 제외)
    below_ma_condition: true  # 종가 ≤ 480선 요구 — false면 선 위/아래 무관
    grace_bars: 1
    crypto_rank_filter:     # 전용 기준 — 5% 급등은 흔해서 자체 필터로 알림량을 조절한다
      enabled: true
      volume_top: 150       # 24h 거래대금 상위 N위 이내, 또는
      gain_top: 100         # 최근 3일 상승률 상위 N위 이내면 통과하되
      gain_lookback_bars: 18  # 상승률 계산 구간 — 18봉 = 3일
      min_turnover_usd: 3000000  # 24h 거래대금 $3M 미만은 무조건 제외
  mss:                      # MSS (4h봉): 직전 스윙저점(좌우 6봉=24h) 하향돌파
    enabled: true
    pivot_k: 6              # 스윙저점 판정 — 좌우 k봉보다 낮은 저가 (6봉 = 24시간)
    grace_bars: 1
    qvwap_condition: true   # 돌파 봉 종가가 분기 앵커드 VWAP 위여야 알림 (눌림목 칸 조건과 동일)

crypto:
  enabled: true
  # auto: fapi(전체 USDT 무기한) 시도 → 미국 IP 등 실패 시 현물 미러로 폴백
  # fapi: 선물 API만 사용(차단 시 크립토 스캔 실패로 표시) / spot_mirror: 미러만 사용
  source: auto
  exclude: []               # 제외할 심볼. 예: [BTCDOMUSDT]
  kline_limit: 750          # 480MA·분기VWAP(최대 552봉) + 터치윈도우 + 여유
  fetch_workers: 6          # 캔들 수집 병렬 워커 수 — 6이면 fapi 가중치 한도의 ~60%


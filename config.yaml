# Invest-Signal 설정

signal:
  uptrend_onset:            # 상승초입 (4h봉)
    touch_window_bars: 60   # 240선 터치 후 60선 이탈을 기다리는 기간 — 60봉 = 10일
    grace_bars: 1           # 직전 스캔을 놓쳤을 때 소급 허용할 봉 수
    require_above_qvwap: false  # true면 트리거 종가가 분기 VWAP 위일 때만 알림

crypto:
  enabled: true
  # auto: fapi(전체 USDT 무기한) 시도 → 미국 IP라 451이면 현물 미러로 폴백
  # fapi: 선물 API만 사용(차단 시 크립토 스캔 건너뜀) / spot_mirror: 미러만 사용
  source: auto
  exclude: []               # 제외할 심볼. 예: [BTCDOMUSDT]
  kline_limit: 750          # 480MA·분기VWAP(최대 552봉) + 터치윈도우 + 여유

etf:
  enabled: true
  # 퀀트포트폴리오 레포(LEV_PAIRS 불 사이드 + LEV_SINGLES) 기준 레버리지 ETF

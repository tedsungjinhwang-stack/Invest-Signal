# Invest-Signal 설정

signal:
  uptrend_onset:            # 상승초입 (4h봉): 역배열 + 240터치 → 60선 이탈
    enabled: true
    touch_window_bars: 60   # 240선 터치 후 60선 이탈을 기다리는 기간 — 60봉 = 10일
    grace_bars: 1           # 직전 스캔을 놓쳤을 때 소급 허용할 봉 수
    qvwap_condition: true   # 트리거 봉 종가가 분기 앵커드 VWAP 위여야 알림 (아래면 위로 올 때까지 대기)
    crypto_rank_filter:     # 크립토 전용 — 3파 전 초입이라 풀백보다 낮은 기준
      enabled: true
      volume_top: 200       # 24h 거래대금 상위 N위 이내, 또는
      gain_top: 100         # 최근 7일 상승률 상위 N위 이내면 통과하되
      gain_lookback_bars: 42  # 상승률 계산 구간 — 42봉 = 7일
      min_turnover_usd: 1000000  # 24h 거래대금 $1M 미만은 무조건 제외
  pullback:                 # 풀백 (4h봉): 240선>480선 구간에서 120선 하회
    enabled: true
    ma_entry: 120           # 하회 판정 기준선 — 60으로 바꾸면 얕은 눌림도 잡음
    grace_bars: 1
    qvwap_condition: true   # 트리거 봉 종가가 분기 앵커드 VWAP 위여야 알림 (아래면 위로 올 때까지 대기)
    crypto_rank_filter:     # 크립토 전용 — 풀백 칸 전체(풀백+MSS 줄)에 주도주 필터 (ETF·주식엔 미적용)
      enabled: true
      volume_top: 100       # 24h 거래대금 상위 N위 이내, 또는
      gain_top: 50          # 최근 7일 상승률 상위 N위 이내면 통과하되
      gain_lookback_bars: 42  # 상승률 계산 구간 — 42봉 = 7일
      min_turnover_usd: 5000000  # 24h 거래대금 $5M 미만은 무조건 제외 (유동성 하한)
  downtrend_reversal:       # 하락전환 (4h봉): 60선 아래 눌림의 직전저점 하향돌파(CHoCH)
    # ETF·주식은 🔻하락전환 칸에 알림·추적 표시. 크립토는 표시하지 않고
    # 풀백 항목을 '유지 중' 리스트에서 제거하는 용도로만 사용
    # (enabled: false면 표시·제거 둘 다 안 함)
    enabled: true
    ma_ref: 60              # 눌림 판정 기준선
    lookback_bars: 180      # 직전저점 유효기간 — 180봉 = 30일
    grace_bars: 1
    qvwap_condition: true   # 돌파 봉 종가가 분기 앵커드 VWAP 아래여야 알림 (상승초입의 거울)
  mss:                      # MSS (4h봉): 직전 스윙저점(좌우 6봉=24h) 하향돌파
    enabled: true
    pivot_k: 6              # 스윙저점 판정 — 좌우 k봉보다 낮은 저가 (6봉 = 24시간)
    grace_bars: 1
    qvwap_condition: true   # 돌파 봉 종가가 분기 앵커드 VWAP 위여야 알림 (풀백 칸 조건과 동일)

crypto:
  enabled: true
  # auto: fapi(전체 USDT 무기한) 시도 → 미국 IP 등 실패 시 현물 미러로 폴백
  # fapi: 선물 API만 사용(차단 시 크립토 스캔 실패로 표시) / spot_mirror: 미러만 사용
  source: auto
  exclude: []               # 제외할 심볼. 예: [BTCDOMUSDT]
  kline_limit: 750          # 480MA·분기VWAP(최대 552봉) + 터치윈도우 + 여유
  fetch_workers: 6          # 캔들 수집 병렬 워커 수 — 6이면 fapi 가중치 한도의 ~60%


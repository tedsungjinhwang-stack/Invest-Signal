# Invest-Signal 설정

signal:
  uptrend_onset:            # 상승초입 (4h봉): 역배열 + 240터치 → 60선 이탈
    enabled: true
    touch_window_bars: 60   # 240선 터치 후 60선 이탈을 기다리는 기간 — 60봉 = 10일
    grace_bars: 1           # 직전 스캔을 놓쳤을 때 소급 허용할 봉 수
    qvwap_condition: true   # 트리거 봉 종가가 분기 앵커드 VWAP 위여야 알림
  pullback:                 # 눌림목 (4h봉): 240선 상향돌파 유지 중 120선 하회
    enabled: true
    breakout_window_bars: 180  # 240선 돌파 유효기간 — 180봉 = 30일
    grace_bars: 1
  downtrend_reversal:       # 하락전환 (4h봉): 120선 아래 눌림의 직전저점 하향돌파(CHoCH)
    enabled: true
    lookback_bars: 180      # 직전저점 유효기간 — 180봉 = 30일
    grace_bars: 1
  mss:                      # MSS (4h봉): 직전 스윙저점(좌우 3봉) 하향돌파
    enabled: true
    pivot_k: 3              # 스윙저점 판정 — 좌우 k봉보다 낮은 저가
    grace_bars: 1

crypto:
  enabled: true
  # auto: fapi(전체 USDT 무기한) 시도 → 미국 IP 등 실패 시 현물 미러로 폴백
  # fapi: 선물 API만 사용(차단 시 크립토 스캔 실패로 표시) / spot_mirror: 미러만 사용
  source: auto
  exclude: []               # 제외할 심볼. 예: [BTCDOMUSDT]
  kline_limit: 750          # 480MA·분기VWAP(최대 552봉) + 터치윈도우 + 여유


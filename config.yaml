# Invest-Signal 설정

signal:
  uptrend_onset:            # 상승초입 (4h봉): 역배열 + 수퍼트렌드 상승 → 20선 이탈
    enabled: true
    # 역배열 판정선 (짧은 것부터). 세 선 모두 오름차순이어야 통과한다.
    # 120<240만 보던 것을 480까지 되돌렸다 — 374종 최근 7일 실측으로
    # 역배열 통과 봉이 77% → 68%, 발화가 51.1 → 43.3건/일이 된다.
    # 대가는 최소 이력 요건이 240봉(40일) → 480봉(80일)으로 올라가는 것:
    # 이력이 모자라 아예 판정 대상에서 빠지는 종목이 1종 → 3종이 된다.
    ma_align: [120, 240, 480]
    ma_entry: 20            # 이탈 판정 기준선 — 4h×20 = 약 3.3일
    grace_bars: 1           # 직전 스캔을 놓쳤을 때 소급 허용할 봉 수
    # 240선 터치 조건 — 껐다. 켜면 '역배열 상태에서 캔들이 240선을 걸친 봉'이
    # touch_window_bars 안에 있어야 하고, '첫 봉' 기준점도 그 터치가 된다.
    touch_condition: false
    touch_window_bars: 60   # (touch_condition을 켤 때만 의미 있음) 60봉 = 10일
    # 수퍼트렌드(4h) 상승추세 요구 — 역배열과 함께 걸면 "장기 구조는 아직
    # 하락인데 단기 추세는 이미 위로 돌아선" 구간만 남는다.
    supertrend_condition: true
    st_period: 22           # 수퍼트렌드 ATR 기간
    st_mult: 3.0            # 수퍼트렌드 ATR 배수
    # VWAP 조건 — 크립토·ETF·주식 모두 켠다.
    # 예전엔 ETF·주식만 껐다("종목이 적어 알림이 안 넘친다"는 이유였다).
    # 유니버스가 47종이라 켜고 끄고의 알림 차이가 하루 1건 수준인데,
    # 역배열 조건이 실제로 걸리게 고친 뒤 재보니 게이트가 승률을 6%p 올렸다.
    # 시장별로 다시 가르려면 crypto_vwap_condition을 추가하면 된다.
    vwap_period: M          # 앵커드 VWAP 리셋 주기 — M(월간)/Q(분기)/W(주간)
    # 판정 방식 — any: 최근 vwap_touch_bars봉 안에 캔들이 선을 걸쳤거나(터치),
    # 종가가 선 위에 있거나 둘 중 하나면 통과. touch/above 단독도 고를 수 있다.
    # above 단독은 값을 못 했다 — 알림의 36%를 걷어내면서 승률은 조건을 아예
    # 끈 60.8%와 같은 60.5%였다. 월간 앵커는 리셋 직후 선이 캔들 안에
    # 파묻혀(1일 첫봉 100%, 첫날 76%) 위/아래 자체가 노이즈이기 때문이다.
    vwap_mode: any
    vwap_touch_bars: 5      # 터치 소급 창 — 5봉 = 20시간
    vwap_condition: true
    crypto_rank_filter:     # 크립토 전용 — 3파 전 초입이라 눌림목보다 낮은 기준
      enabled: true
      volume_top: 200       # 24h 거래대금 상위 N위 이내, 또는
      gain_top: 100         # 최근 3일 상승률 상위 N위 이내면 통과하되
      gain_lookback_bars: 18  # 상승률 계산 구간 — 18봉 = 3일
      min_turnover_usd: 3000000  # 24h 거래대금 $3M 미만은 무조건 제외
  pullback:                 # 눌림목 (4h봉): 480선 위 + 60선 하회
    enabled: true
    crypto_enabled: false   # 크립토는 눌림목 대신 크립토 모멘텀 눌림목/이탈로 본다 (ETF·주식만 유지)
    ma_entry: 60            # ② 이 선을 하회해야 함 (단기 조정)
    ma_above: 480           # ① 종가가 이 선 위여야 함 (장기 추세 유지)
    band_mult: 1.0          # ③ 하단 밴드 = 분기VWAP − mult×표준편차 (2.0이면 더 깊은 눌림만)
    # 밴드 조건 끔 — ①480선 위 + ②60선 하회만 본다. 타점은 '밴드 터치'가
    # 정의라 함께 사라지고, 알림에 대기/타점 태그가 붙지 않는다.
    band_condition: false
    grace_bars: 1
    # 수퍼트렌드가 하락으로 뒤집히면 추적에서 뺀다 — 눌림목은 "장기 추세가
    # 살아 있는 동안의 조정"이라, 추세가 꺾이면 조정이 아니라 전환이다.
    # 진입 조건은 아니고 해제 조건으로만 쓴다.
    supertrend_exit: true
    st_period: 22
    st_mult: 3.0
    crypto_rank_filter:     # 크립토 전용 — 눌림목+MSS 줄에 주도주 필터 (ETF·주식엔 미적용)
      # 그 시기의 주도주만 남기려면 거래량·상승률을 둘 다 요구해야 한다.
      # 백테스트(2026-06-14~07-29, 373종 4h): OR 기준 3.0건/일·승률 46%였는데
      # AND + 14일 상승률 상위 10%로 바꾸면 2.4건/일·승률 65%로 개선됐다.
      enabled: true
      mode: and             # 거래대금·상승률 조건을 모두 만족해야 통과 (or면 둘 중 하나)
      volume_top: 200       # 24h 거래대금 상위 N위 (실질 컷은 아래 min_turnover_usd)
      gain_top_pct: 0.10    # 상승률 상위 10% 이내 — 종목 수가 변해도 기준이 안 흔들림
      gain_lookback_bars: 84   # 상승률 계산 구간 — 84봉 = 14일 (눌림 + 직전 상승 레그)
      # 유동성 하한. 미국 IP에선 선물이 막혀 현물 거래대금으로 재므로 체감보다 빡빡하다.
      # 올릴수록 적중률이 오르는 축이다 — $1M 65% / $2M 67% / $5M 74% (알림은 2.4→0.98건/일)
      min_turnover_usd: 1000000  # 24h 거래대금 $1M 미만은 무조건 제외
  downtrend_reversal:       # 하락전환 (4h봉): 60선 아래 눌림의 직전저점 하향돌파(CHoCH)
    # ETF·주식은 🔻하락전환 칸에 알림·추적 표시. 크립토는 표시하지 않고
    # 눌림목 항목을 '유지 중' 리스트에서 제거하는 용도로만 사용
    # (enabled: false면 표시·제거 둘 다 안 함)
    enabled: true
    ma_ref: 60              # 눌림 판정 기준선
    lookback_bars: 180      # 직전저점 유효기간 — 180봉 = 30일
    grace_bars: 1
    qvwap_condition: true   # 돌파 봉 종가가 분기 앵커드 VWAP 아래여야 알림 (상승초입의 거울)
    # 수퍼트렌드 해제 조건도 거울 방향 — 이 시그널의 전제가 하락 전환이므로
    # 추세가 **상승**으로 뒤집히면 셋업이 끝난 것으로 보고 추적에서 뺀다.
    supertrend_exit: true
    st_period: 22
    st_mult: 3.0
  pump_early:               # 펌핑초기 (4h봉, 크립토 전용): 막 불붙은 봉 — 아직 크게 안 간 종목만
    # 껐다. 최근 10일 퍼프 실측(75건)에서 24h -2.3% / 3d -2.9% / 7d -2.4%,
    # MAE -8.1%로 중앙값이 모든 구간에서 마이너스였다. MFE +7.8%라 위로도
    # 가긴 하는데 경로 승률 53%로 사실상 동전 던지기다.
    # 모듈과 테스트는 그대로 두므로 되살리려면 이 한 줄만 true로.
    enabled: false
    rise_bars: 1            # 급등 판정 구간 — 1봉 = 4시간 (2로 올리면 8시간)
    min_gain: 0.05          # 구간 시가 대비 종가 상승률 하한 (0.05 = +5%)
    lookback_bars: 42       # '아직 초기' 판정 구간 — 42봉 = 7일
    pump_window_bars: 6     # 이미 펌핑했는지 볼 창 — 6봉 = 하루 (펌핑 시그널과 동일 정의)
    max_pump_gain: 0.30     # 위 구간 안에 '하루 내 저점→고가 +30% 이상' 봉이 있으면 제외
    max_gain: 0.30          # 누적 기준 — 42봉 저점 대비 종가가 이 이상이면 제외
    ma_ref: 480             # 이 선 이하에 캔들이 있어야 함 (480봉 미만 신규 상장은 자동 제외)
    below_ma_condition: true  # 종가 ≤ 480선 요구 — false면 선 위/아래 무관
    grace_bars: 1
    crypto_rank_filter:     # 전용 기준 — 5% 급등은 흔해서 자체 필터로 알림량을 조절한다
      enabled: true
      volume_top: 150       # 24h 거래대금 상위 N위 이내, 또는
      gain_top: 100         # 최근 3일 상승률 상위 N위 이내면 통과하되
      gain_lookback_bars: 18  # 상승률 계산 구간 — 18봉 = 3일
      min_turnover_usd: 3000000  # 24h 거래대금 $3M 미만은 무조건 제외
  wave_setup:               # 파동 (크립토 전용): 수퍼트렌드 두 개로 잡는 세 변형
    #  ⓐ ABC   — 단기가 상승 전환(돌파)하거나, 그 뒤 추세선을 터치
    #  ⓒ 되돌림 — 장기가 상승 전환한 뒤 저점~고점의 0.5까지 밀린 자리
    #  ⓑ 임펄스 — 둘 다 하락인 일봉에서 캔들이 단기선을 터치
    enabled: true
    # 공통 전제 — 장기 수퍼트렌드가 아직 하락. 단기를 어떻게 건드리는지가 갈린다.
    fast_period: 22         # 단기 수퍼트렌드 ATR 기간
    fast_mult: 3.0          # 단기 수퍼트렌드 ATR 배수
    slow_period: 30         # 장기 수퍼트렌드 ATR 기간
    slow_mult: 6.0          # 장기 수퍼트렌드 ATR 배수
    # ⓐ ABC — 4h봉. 둘 다 하락이던 상태에서 종가가 단기선을 돌파해 마감한 봉.
    #    그 마감이 곧 단기 수퍼트렌드를 상승으로 뒤집는다(장기는 여전히 하락).
    abc_enabled: true
    # ⓑ 임펄스 — 일봉. 둘 다 하락인 채로 캔들이 단기선을 터치한 날.
    #    일봉은 따로 받지 않고 4h봉 6개를 묶어 만든다(UTC 00시 정렬).
    # **꺼 뒀다.** 일봉 터치는 4h ABC와 같은 자리를 한 단계 굵은 눈금으로
    # 다시 보는 것이라 줄만 늘고 새로 알려주는 게 없었다. 4h만 남긴다.
    # 모듈·테스트는 그대로라 이 한 줄만 true로 되돌리면 살아난다.
    impulse_enabled: false
    # ⓐ 단기가 상승 전환한 뒤 이 봉 수 안에 장기선을 터치해야 한다(12봉 = 이틀).
    # 핵심은 '최근에 뒤집혔다'이지 '며칠 지났다'가 아니라서 하한은 없다 —
    # 전환 봉에서 바로 닿아도 인정한다.
    flip_window_bars: 12
    # ⓐ가 잡는 세 자리. 한 봉이 여럿에 걸리면 아래 순서로 하나만 남는다
    # (dedup 키가 종목·봉·변형이라 어차피 하나뿐이다).
    abc_touch_slow: true    # ① 장기선 터치 — 반등이 위쪽 저항까지 되돌린 자리
    abc_flip: true          # ② 단기선 돌파 — 전환 봉 자체. 되돌림을 안 기다린다
    abc_touch_fast: true    # ③ 단기선 터치 — 방금 넘긴 선을 다시 눌러 보는 자리
    grace_bars: 1           # 4h 지각 허용 봉 수
    daily_grace_bars: 1     # 일봉 지각 허용 봉 수 — 하루 1봉이라 따로 둔다
    # ⓐ만 추적 보유 기간을 짧게 — 돌파는 4h짜리 사건이라 며칠 지나면
    # '방금 돌파한 자리'가 아니게 된다. ⓑ는 일봉 터치라 성격이 달라
    # 공용 창(scanner.TRACK_DAYS = 5일)을 그대로 쓴다. 0이면 제한 없음.
    # 10 → 3. 이전 주석("⚡ 10일과 눈금을 맞춘다")은 사실과 달랐다 — 스캐너가
    # ONGOING_LOOKBACK_BARS(=TRACK_DAYS×6=30봉)로 소급 창을 넓혀 부르므로
    # min(30, 10×6)=30, 즉 10을 넣어도 실효 창은 5.2일이었다. 3은
    # min(30, 18)=18 → 19봉 ≈ 3.2일로 실제로 좁아진다.
    # 사흘 뒤에 움직이기 시작하는 종목은 아래 ⓒ가 되돌림으로 다시 잡는다.
    abc_track_days: 3
    # ⓒ 되돌림 — 4h 장기 수퍼트렌드가 상승으로 뒤집힌 뒤(=돌파),
    #   저점~고점에서 retrace_level까지 **처음** 밀린 자리.
    #   좌표는 사건 순서(저점 → 단기 상승 전환 → 장기 돌파 → 고점)를 따른다:
    #     고점 = 돌파봉 이후 ~ 판정 봉 직전의 최고가 (러닝 맥스, 창 없음)
    #     저점 = 그 돌파로 이어진 **단기 상승 전환 봉 앞 W봉**의 최저가
    #            (W = retrace_window_days × 6)
    #
    # **저점 창을 고점에 붙이면 안 된다.** 처음엔 그렇게 짰는데, 고점이 W봉
    # 보다 늦게 서면 창이 통째로 돌파 뒤로 밀려 랠리 중간 눌림을 저점이라
    # 불렀다 — 판정 봉의 33.6%, 발화의 11.6%가 그랬고, high_i−b ≥ 18인
    # 행에서는 100%였다. 저점 창을 단기 전환 봉에 붙이면 정의상 100% 지킨다.
    # **고점에는 반대로 창을 두면 안 된다.** 롤링 창을 씌우면 진짜 고점이
    # 창 밖으로 밀리는 순간 고점이 낮아져(판정 봉의 28.9%, 중앙 −5.4%)
    # 📐의 분모가 거짓이 되고 화면 값이 뒷걸음질친다. 오래된 고점의 만료는
    # retrace_expire_bars가 이미 맡는다.
    #
    # 실측 — 현물 미러 370종 · 4h 749봉 · 124일, 장기 상승 전환 883건.
    # 실제 봇은 퍼프 약 525종을 본다: 캔들 기하(고점 시점·되돌림 비율·폭)는
    # 옮겨 가지만 **'하루 몇 건'은 재현되지 않는다. 배수와 방향만 믿어라.**
    # VWAP 게이트·랭크필터·거래대금 하한은 아래 수치에 안 걸려 있다.
    #   · 발화율 84.7%(748/883) · 6.03건/일 · 파동 폭 중앙 24.0%
    #   · 고점에서 5%도 안 밀리고 울리는 발화 4.8% (옛 정의 16.0%)
    #   · 발화 후 저점 이탈(📐 1.0 초과) 5.1% (옛 정의 13.3%)
    #   · 고점은 돌파 뒤 중앙 6봉(1일)에 서지만 25%는 사흘을 넘긴다
    #     → 고정 봉 수로 못 박지 않고 러닝 맥스 + 아래 고점 확정으로 잡는다
    #
    # **이건 승률 장치가 아니라 화면 장치다 — 그것도 비용이 있는 쪽이다.**
    # 알림 봉 종가 진입·42봉 또는 장기 재하락까지 보유로 재면 발화군 748건이
    # 경로 승률 64.0% · MFE 중앙 7.5% · 종료 수익 중앙 **−3.7%**인데,
    # 0.5까지 안 밀려 아예 안 울린 돌파 133건은 **승률 92.3% · 종료 +9.0%**다.
    # 되돌림을 기다리는 건 정확히 그 승자들을 건너뛰는 행위다. 이 기능의
    # 존재 이유는 abc_track_days를 3으로 줄이며 사라지는 줄을 되살리는 것
    # 하나뿐이고, 그 대가가 이 수치다. 나중에 재평가할 때 이 문장을 봐라.
    retrace_enabled: true
    # (고점−현재가)÷(고점−저점). 신규 알림은 이 값에 처음 닿을 때 한 번만
    # 나가고, 그 뒤로는 추적 줄의 📐가 매 스캔 갱신된다. 1.0을 넘으면 저점을
    # 깬 것이라 줄이 빠진다.
    # **단조 상승하지 않는다** — 가격이 오르면 📐은 내려간다(갱신의 40%대).
    # 정의로 없앨 수 있는 건 좌표 때문에 튀는 것뿐이고 그건 0이다.
    # 발화는 **저가**로 판정하는데 📐은 **종가**로 재므로 첫 표시가 0.5보다
    # 작을 수 있다(발화 📐 중앙 0.50, 절반 가까이가 0.5 미만에서 시작).
    retrace_level: 0.5
    # 저점을 훑는 창(일). 3일 = 18봉. 단기 상승 전환 봉에서 거슬러 잰다.
    # 창을 늘리면 저점이 깊어져 레벨이 멀어진다: 3일 84.7% / 7일 83.2%.
    # 창을 아예 없애고 직전 장기 하락 구간 전체를 훑는 안(발화 81.8%,
    # 이탈 2.9%)도 쟀는데, 저점이 중앙 26봉·최대 394봉까지 거슬러 올라가
    # 차트에서 '이 파동'으로 안 읽히고 프레임 길이(신규 상장)에 흔들려 뺐다.
    retrace_window_days: 3
    # 고점이 이 봉 수 이상 갱신되지 않았을 때만 무장. **이게 유일한 실질
    # 레버다** — 어느 저점 정의에서도 경로 승률이 +5~8%p 오르는데 발화율은
    # 1~3%p만 깎인다. 0이면 고점 바로 다음 봉도 잡는다.
    retrace_hold_bars: 2
    # 돌파 후 이 봉 수까지만 감시(42봉 = 7일). 고점에 창을 안 두므로
    # '오래된 고점'의 만료를 이 값이 대신 맡는다.
    retrace_expire_bars: 42
    # 발화 후 추적 보유 일수. 실효 창은 min(30, 2×6)+1 = 13봉(2.2일).
    # 3일로 두면 ⓒ 줄이 약 20% 는다. 다만 파동 칸 줄 수의 **진짜 레버는
    # 아래 min_turnover_usd다** — 그 하한 하나가 칸을 2.3배 깎는다.
    retrace_track_days: 2
    # 월간 앵커드 VWAP 조건 — 상승초입과 같은 규칙. 두 변형 모두 4h 프레임의
    # MVWAP으로 재고(임펄스는 그날 마지막 4h봉이 기준점), 일봉으로 다시
    # 계산하지 않는다 — 하루치가 대표가격 하나로 뭉쳐져 터치가 무뎌진다.
    vwap_condition: true
    vwap_period: M          # M(월간)/Q(분기)/W(주간)
    vwap_mode: any          # any(터치 또는 위) / touch(터치만) / above(위만)
    vwap_touch_bars: 5      # 터치 소급 창 — 4h 5봉 = 20시간
    # 🍃조용 태그 기준 — **거르는 조건이 아니라 표시용**이다. ⚡와 같은 축이지만
    # 기준값은 따로다: 파동은 하락 추세 종목을 잡아 변동성 중앙값이 2.9%라
    # (⚡는 7.3%) ⚡ 값을 그대로 쓰면 전부 붙는다.
    # 30일 리플레이 실측(퍼프 281건, PROBE_MODE=leaders + PROBE_REPLAY=1):
    # 24h 거래대금 하위 25%($5.2M 미만)에서 대박률 24%→27%로 **오르고**
    # 쪽박률은 21%→7%로 떨어졌다(경로 승률 64%).
    # 변동성은 상한만 두지 않고 밴드다 — 하위 25%(1.9% 미만)는 대박 6%·쪽박 1%로
    # 안 깨지지만 안 가기도 했고, 2.9~4.4%가 대박 37%·쪽박 21%로 가장 좋았다.
    quiet_turnover_usd: 5000000   # 4h 6봉 종가×거래량 합이 이 아래이고
    quiet_atr_min: 0.019          # 4h ATR(14)÷종가가 이 위 ~
    quiet_atr_max: 0.044          # 이 아래면 🍃조용
    crypto_rank_filter:
      # **비율 기준으로 바꿨다.** 같은 코드가 퍼프(525종)와 현물 미러(370종)
      # 양쪽에서 도는데 절대 순위(200/100)는 유니버스가 바뀌면 자르는 지점이
      # 같이 움직인다. MIRA가 8/19 20:00에 단기선 돌파로 발화했는데 거래대금
      # 203위(상위 55%)·상승률 186위(상위 50%)로 둘 다 못 들어 지워졌다 —
      # 하락트렌드를 뚫기 직전의 자리였다. 상위 75%까지 열어 그런 중위권
      # 종목을 살린다. 실질 컷은 아래 min_turnover_usd 하나로 남는다.
      enabled: true
      volume_top_pct: 0.75    # 거래대금 상위 75% 이내, 또는
      gain_top_pct: 0.75      # 상승률 상위 75% 이내면 통과 (합집합)
      gain_lookback_bars: 18
      # $3M → $1M. ZKC가 8/20에 ABC 조건(8/19 12:00 단기선 돌파,
      # 8/20 12:00 장기선 터치)과 VWAP을 다 통과하고 여기서만 걸렸다 —
      # 퍼프 거래대금이 그 기간 내내 $0.72~1.96M이라 하한의 절반이었다.
      # 합집합(or)이라 나머지 조건은 느슨해서, 실질 컷은 이 하한 하나다.
      min_turnover_usd: 1000000  # 24h 거래대금 $1M 미만은 무조건 제외

  leader_break:             # 크립토 모멘텀 눌림목/이탈 (15m봉, 크립토 선물 전용)
    # 24h 상승률 상위 top_n종이 15분봉 ma선을 하향 이탈하는 첫 봉에서 알림.
    # 대상 선정은 바이낸스 24hr 티커(전 종목 1회 요청)라 캔들 역산과 달리
    # 지연이 없다. 4h 프레임을 안 쓰므로 마감·인트라바 스캔 양쪽에서 매번 돈다.
    enabled: true
    # 감시 창(watch_days 10일)이 길어서 매 스캔 새로 드는 종목이 그대로
    # 쌓인다 — 15로 두니 추적 줄이 59줄까지 갔다. 5·7을 거쳐 10에 왔다.
    # **board_top을 같이 움직인다.** 예전에 top_n 10 · board_top 5였을 때
    # 6~10위가 순위표에 안 보인 채 알림 줄로만 나타나서 어디서 온 종목인지
    # 알 수가 없었다. 둘을 붙여 두면 순위표가 곧 그 스캔의 감시 대상이다.
    top_n: 10               # 24h 상승률 상위 몇 종을 감시 대상으로 삼을지
    board_top: 10           # 알림 맨 위 순위표에 조건 없이 적을 상위 종목 수
    ma: 20                  # 15m봉 SMA 기간 — 20봉 = 5시간
    grace_bars: 4           # 소급 판정 봉 수 — 15m×4 = 1시간(스캔 주기)
    # 유동성 하한. 0으로 두면 순수 상승률 상위 top_n종이 되지만, 거래가 거의 없는
    # 잡코인이 상위권을 채운다. 다른 시그널의 하한과 달리 이건 **상위권 후보를
    # 추리는 자격 요건**이라(leaders()가 top_n을 뽑기 전에 적용), 올리면 알림
    # 수보다 📈24h 상승률 TOP에 뜨는 얼굴이 먼저 바뀐다.
    # 측정 기준도 다르다 — 4h봉 종가×거래량 근사치가 아니라 24hr 티커의
    # 실제 quoteVolume이다.
    # $1M. 이월분에도 같은 하한이 걸려서, 상위권에 들 때는 거래가 많았다가
    # 그 뒤 말라붙은 종목이 감시 창(10일)을 다 못 채우고 빠진다 — $3M에서
    # 이월분 제외가 27종이었고 $1M에서 15종이다. 파동 랭크 필터도 같은 값.
    # 추적 줄이 길어지는 방향이라, 줄이려면 watch_days를 손대는 게 맞다.
    min_turnover_usd: 1000000
    # 한 번 상위권에 든 종목은 순위에서 밀려나도 이 기간은 계속 확인한다 —
    # 상위권은 하루에도 여러 번 바뀌어서, 밀리자마자 눈을 떼면 정작 꺾이는
    # 순간을 놓친다. 마지막 등재 시각은 상태 파일의 leaders에 남는다.
    # 다른 시그널의 추적 보유 기간(scanner.TRACK_DAYS)은 5일이지만 이건 10일이다 —
    # 15m 20선은 하루에도 여러 번 넘나드는 선이라, 5일이면 한 번 밀린 주도주가
    # 다시 자리를 잡기 전에 목록에서 사라진다.
    watch_days: 10
    # 한 스캔에서 15m 캔들을 받을 최대 종목 수(요청량 상한).
    # **watch_days와 같이 봐야 한다** — 이 상한을 넘으면 최근 등재 순으로 잘려서,
    # 오래된 이월분(6~10일차)은 이름만 있고 실제로는 한 번도 안 보게 된다.
    # 창을 5→10일로 늘리면서 60→120으로 같이 올렸다. 다만 실제로 상한에
    # 걸리는지는 로그를 봐야 안다 — 이월분이 빠지는 더 큰 이유는 위의
    # min_turnover_usd 하한이고(샌드박스 현물 실측: 제외 49종이 전부 하한
    # 미달, max_watch 초과 0종), 스캔 로그가 둘을 나눠 찍는다.
    max_watch: 120
    # 추적 목록에 이탈 조건을 그대로 걸지 여부.
    # false면 감시 창 안의 전 종목을 선 위/아래 상관없이 상태만 보여준다 —
    # 선 위로 복귀해도 줄이 남아서 그 종목이 지금 어느 쪽인지 계속 보인다.
    track_break_only: false
    # 1h 구조로 거르는 두 조건.
    #
    # **원래 전제는 실측에서 뒤집혔다.** "24h 상승률 상위여도 1h가 역배열·
    # 혼조면 하락 추세 안의 반등이라 뺀다"고 적어 놨었는데, 31일 리플레이
    # (현물 미러 370종 · 15m 20선 이탈 10,651건 · 이탈 봉 종가 진입 ·
    #  전진 7일 · 경로 승률 = ±10% 중 먼저 찍은 쪽)에서 정배열이 꼴찌였다:
    #
    #     배열     경로승률   MFE     MAE     대박    쪽박    건수
    #     정배열    57.6%   12.4%   −8.9%   35%    22%    5,377
    #     혼조      67.2%   14.1%   −7.7%   38%    16%    3,266
    #     역배열    65.8%   16.1%   −6.8%   43%    18%    2,008
    #
    # 정배열은 이미 오를 만큼 오른 자리라 20선 이탈이 '눌림'이 아니라
    # '첫 균열'인 경우가 많다 — 쪽박률이 셋 중 제일 높다. 혼조·역배열은
    # 깊은 데서 올라오는 중이라 더 빠질 여지가 적고 반등폭이 크다.
    #
    # 설정별 결과(퍼프 환산 = 미러 건수 × 실제/미러 배수. 실제 ⚡는 328건/일):
    #     정배열만(옛 기본)      328건/일   57.8%   대박 33%  쪽박 20%
    #     정배열+혼조 ← 지금     566건/일   61.8%   대박 35%  쪽박 18%
    #     정배열+역배열          474건/일   60.4%   대박 36%  쪽박 20%
    #     전부(require_aligned:false) 712건/일 62.7% 대박 37%  쪽박 18%
    #
    # **주의 — 이득은 '감시 이월분'에서만 나온다.** 지금 이 순간 24h 상승률
    # TOP10인 종목만 따로 보면 세 배열이 평평했다(51.8/51.0/49.7%). 열흘 전
    # 상위였다가 밀린 종목의 되돌림이 깊어서 생기는 차이다. 국면 의존도 커서,
    # 전반 12일 vs 후반 12일로 쪼개면 혼조 승률이 59.8% → 72.5%로 흔들린다
    # (방향은 양쪽 다 같다). 표본은 단일 31일 · 현물 미러라 배수만 믿어라.
    require_aligned: true            # 1h 배열을 보는지 (끄면 배열 무관 전부 통과)
    # 켜면 **혼조도 통과**한다. 위 표에서 혼조가 승률 67.2%로 세 버킷 중
    # 제일 좋아서 켰다 — 정배열만 볼 때보다 승률 57.8 → 61.8%, 쪽박 20 → 18%.
    # 대가는 알림량이다(328 → 566건/일). 줄이려면 이걸 끄거나 top_n을 내려라.
    allow_mixed: true
    # 켜면 역배열도 통과한다. 역배열도 성적은 좋지만(65.8%) 둘 다 켜면
    # 712건/일이 되는데 ⚡가 이미 전체 알림의 88%라 거기까지는 안 갔다.
    # 켜면 역배열 줄에 🌱상승초기 마크가 붙어 정배열과 구분된다
    # (notify.EARLY_TAG). 혼조 줄은 그냥 '혼조' 배열 태그로 구분된다.
    allow_bearish: false
    # 정배열이어도 **4h 장기 수퍼트렌드가 하락이면 제외** — 캔들이 4h
    # 장기선 위에 있어야 통과다. 고정 이동평균(예전 1h 480선)에서 바꿨다:
    # 트레일링 스톱이라 얕은 눌림엔 안 꺾이고 추세가 실제로 돌아설 때만
    # 꺾여서, '오를 만큼 오른 뒤'를 묻는 조건에 눈금이 맞는다.
    # 선은 🔼단기전환이 쓰는 4h 장기선과 같다(turn_slow_period × mult).
    # **정배열에만 건다.** 역배열은 장기선 아래인 게 정상이라 걸면 통째로
    # 다시 잘리고, 혼조는 걸면 오히려 나빠진다 — 혼조·수트↓(승률 70.9%)가
    # 혼조·수트↑(64.5%)보다 좋아서, 혼조에 이걸 걸면 정배열+혼조 승률이
    # 61.8% → 59.8%로 떨어지고 알림도 566 → 468건/일로 준다.
    # 정배열에는 계속 유효하다 — 정배열·수트↓가 쪽박률 33%로 전 버킷 최악이다.
    exhausted_filter: true
    # 정배열 판정선 (**1h봉**). 120 > 240 > 480 셋이 순서대로 서야 정배열이다.
    # 4h로 보던 것을 1h로 내렸다 — 4h 480선은 80일이라 구조가 너무 늦게
    # 움직였고, 15m으로 판정하는 시그널의 게이트로는 눈금이 안 맞았다.
    # 1h면 480봉 = 20일이라 이력 요건도 같이 내려가 신규 상장이 덜 잘린다.
    exhausted_mas: [120, 240, 480]
    # 🍃조용 태그 기준 — **거르는 조건이 아니라 표시용**이다.
    # 최근 10일 퍼프 알림 1785건 실측(debug_probe.py PROBE_MODE=leaders)에서
    # 이 시그널의 대박(7일 내 고점 +20%↑)과 쪽박(저점 −15%↓)은 같은 축이었다 —
    # 확장도·변동성·거래대금 어느 것으로 잘라도 최상위 구간이 대박률 36~44%에
    # 쪽박률 49~67%로 양쪽 다 컸다. 유일한 비대칭이 거래대금 하위 구간으로,
    # $6.2M 미만에서 대박률은 28%→25%로 거의 그대로인데 쪽박률이 37%→10%였고
    # 3일 뒤 중앙 수익률이 플러스인 유일한 구간이었다(경로 승률 68%).
    # 변동성 조건까지 AND로 걸면 쪽박률이 8%까지 내려간다.
    quiet_turnover_usd: 6000000      # 24h 거래대금이 이 아래이고
    quiet_atr_pct: 0.073             # 4h ATR(14)÷종가가 이 아래면 🍃조용
    # 📐 되돌림 표시 — **1h 파동**의 저점·고점 대비 지금 어디까지 밀렸는지.
    # 파동 한 사이클:
    #   장기 하락 전환 ─┐ 이 구간 최저 저가 = 저점
    #   단기 상향 돌파 ─┘
    #                   │ 이 구간 최고 고가 = 고점
    #   단기 하향 돌파 ── 파동 확정(= 눌림 시작)
    # 저점은 장기가 다시 깨질 때까지 고정이라, 단기가 여러 번 오르내리면
    # 같은 저점에 고점만 다른 파동이 이어진다.
    # **매 스캔 현재가로 다시 잰다** — 파동이 닫힌 시점 값으로 재면 안 된다.
    # 단기 수퍼트렌드는 고점에서 조금만 밀려도 뒤집혀서 그 순간 되돌림이
    # 구조적으로 얕다(PTB 10일 실측 9개 파동이 전부 0.09~0.34였다).
    #
    # **30m에서 1h으로 옮겼다.** 30m 파동은 폭이 2~8%밖에 안 돼 분모가
    # 작았고, 조금만 밀려도 값이 1.0을 훌쩍 넘었다 — 📐2.28(ME)·📐1.80
    # (EIGEN)·📐9.28 같은 게 실제로 알림에 나왔다. 같은 종목을 1h으로 재면
    # 폭이 8~79%가 되고 값도 0.6~1.2로 돌아온다(ME 1.04 · EIGEN 0.97).
    # 게이트가 이미 받아 두는 프레임이라 30m 요청이 통째로 없어졌다.
    fib_enabled: true
    # 0.618 → 0.5. 실측에서 📐가 안 붙은 줄은 전부 '파동을 못 찾아서'가 아니라
    # '아직 얕아서'였다 — 실제값이 0.01(PROM)부터 0.53(ENA)까지 퍼져 있는데
    # 화면에서는 똑같이 무표시라 구분이 안 됐다. 절반까지 밀린 것부터 보여준다.
    fib_min: 0.5            # 이 아래면 표시 안 함. 1.0 넘으면 '저점이탈'
    # 🔼 단기전환 표시 — 4h 수퍼트렌드 장기(30,6)가 상승인 상태에서
    # 단기(22,3)가 하락→상승으로 뒤집힌 직후. 눌림이 끝나고 추세에 다시
    # 붙는 지점이라, 📐되돌림이 '얼마나 밀렸나'라면 이건 '돌아섰나'다.
    # 4h 프레임은 배열 판정용으로 이미 받아둔 걸 그대로 쓴다(추가 요청 0).
    # **꺼 뒀다.** ↗️1h와 이름이 겹쳐서 한 줄에 '단기선터치'가 두 번 나오는데
    # 뜻은 정반대였다 — 4h는 단기가 상승 중이라 선이 아래에 있어 지지고,
    # 1h은 단기가 하락 중이라 선이 위에 있어 저항이다. 같은 걸 두 프레임으로
    # 겹쳐 보느니 더 잘게 보는 1h만 남긴다. 되살리려면 이 한 줄만 true로.
    turn_enabled: false
    turn_bars: 3            # 전환·터치 후 이 봉 수까지 유지 (3 × 4h = 12시간)
    # 단기가 이미 상승인데 봉이 단기선까지 밀렸다 닿으면 🔼단기선터치.
    # 전환은 선을 되찾는 순간이고 터치는 그 뒤 눌릴 때마다 선이 받쳐 주는
    # 자리라, 전환을 놓치고 들어온 종목은 터치에서만 보인다. 한 봉이 둘 다면
    # 전환이 이긴다. 상승 추세 내내 반복되는 사건이라 전환보다 훨씬 자주 뜬다.
    turn_touch: true
    # ↗️ 1h 저항 테스트 — 위 🔼와 정반대 국면이다. 1h 단기선이 **위에** 있는
    # 채로 캔들이 아래에서 올라와 닿으면 ↗️1h단기선터치, 종가가 넘겨 단기가
    # 뒤집히면 ↗️1h단기선돌파. 뚫으면 국면이 바뀌고 못 뚫으면 저항이 확인되니
    # 어느 쪽이든 그 줄에서 보여야 한다. 한 봉이 둘 다면 돌파가 이긴다.
    # 장기 방향은 **사건이 난 직전 봉** 기준으로 본다 — 세게 뚫는 봉은 장기까지
    # 같이 뒤집혀서, 그 봉으로 재면 정작 잡고 싶은 돌파가 통째로 걸러진다.
    # 1h는 4h·30m 어느 쪽으로도 못 만드는 프레임이라 종목마다 따로 받는다
    # (📐와 같은 대상, 즉 blocked()를 통과한 종목 수만큼만 는다).
    turn1h_enabled: true
    # 3 → 24. 3봉(3시간)은 너무 좁았다 — 실측에서 게이트 통과 4종의 마지막
    # 1h 상승 전환이 8·14·19·47봉 전이라 창 안에 든 게 하나도 없었다.
    # 24봉 = 하루. 4h의 turn_bars 3봉(12시간)과 비슷한 시간 눈금이다.
    turn1h_bars: 24         # 터치·돌파 후 이 봉 수까지 유지 (24시간)
    # **꺼 뒀다.** 게이트가 1h 정배열을 요구하게 되면서 통과 종목의 1h 장기
    # 수퍼트렌드는 사실상 항상 상승이다(실측: 통과 3종 중 하락 0종). 켜 두면
    # ↗️가 구조적으로 한 번도 안 붙는다 — 실제로 스캔 두 번 연속 0건이었다.
    # 끈 지금은 '큰 추세는 살아 있는데 1h 단기가 꺾인 눌림'에서 그 단기선을
    # 다시 건드리거나 뚫는 자리를 잡는다. 게이트가 국면을 이미 좁혀 놨으니
    # 이 조건이 할 일이 없어진 셈이다.
    turn1h_require_bearish: false
    # ↗️ 15m 저항 테스트 — 같은 판정을 한 단계 더 잘게. 15m 프레임은 이탈
    # 본판정용으로 이미 받아 두므로 추가 요청이 없다. 1h이 '눌림이 돌아서나'를
    # 보면 이건 그 안의 잔 파동을 본다 — 둘이 같이 붙으면 두 눈금이 함께
    # 돌아섰다는 뜻이다.
    # 창이 8봉(2시간)인 건 스캔이 매시간 돌기 때문이다. 4봉이면 겨우 한 스캔
    # 간격이라, 그 두 배를 둬야 직전 스캔에서 난 사건도 한 번 더 보인다.
    turn15m_enabled: true
    turn15m_bars: 8         # 터치·돌파 후 이 봉 수까지 유지 (2시간)
    turn15m_require_bearish: false
    # MA480은 480봉(80일)이 있어야 성립한다. 상장 80일 미만이면 배열 판정이
    # 안 돼 require_aligned에서 걸린다 — 신규 상장이 24h 상승률 상위를 자주
    # 차지하는 만큼 체감이 크다. 통과시키려면 아래를 true로.
    allow_short_history: false
  mss:                      # MSS (4h봉): 직전 스윙저점(좌우 6봉=24h) 하향돌파
    # 진입 조건은 위 pullback 설정(480선 위·60선 하회)을 그대로 공유하고,
    # 그 위에 스윙저점 이탈이라는 프라이스 액션이 있으면 ⚠️MSS로 표기한다
    enabled: true
    # 눌림목 칸에 태그로 붙는 줄이라 눌림목을 뺀 크립토에선 같이 뺀다
    # (눌림목 진입 게이트를 통과해야 성립하는 표시라 단독으로는 의미가 없다)
    crypto_enabled: false
    pivot_k: 6              # 스윙저점 판정 — 좌우 k봉보다 낮은 저가 (6봉 = 24시간)
    grace_bars: 1

